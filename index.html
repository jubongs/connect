
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CNCMEDITECH | Server Access</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, "Malgun Gothic", sans-serif;
  background: #f3f6fb;
  color: #17243a;
}
header {
  background: #fff;
  padding: 22px 7%;
  border-bottom: 1px solid #e5eaf1;
  font-size: 21px;
  font-weight: bold;
}
main {
  max-width: 720px;
  margin: 75px auto;
  padding: 20px;
  text-align: center;
}
.logo { font-size: 46px; margin-bottom: 18px; }
h1 { font-size: 32px; margin-bottom: 12px; }
.subtitle {
  color: #64748b;
  line-height: 1.7;
  margin-bottom: 35px;
}
.panel {
  background: white;
  border-radius: 18px;
  padding: 38px 25px;
  box-shadow: 0 8px 30px rgba(20,40,70,.07);
}
.download {
  display: block;
  width: 100%;
  background: #2475d0;
  color: white;
  padding: 18px;
  border: 0;
  border-radius: 10px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}
.download:hover { background: #1764bb; }
.note {
  margin-top: 20px;
  color: #64748b;
  font-size: 14px;
  line-height: 1.8;
}
footer {
  margin-top: 45px;
  color: #94a3b8;
  font-size: 13px;
  line-height: 1.9;
}
footer a { color: #64748b; text-decoration: none; }

/* 비밀번호 입력창 */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, .55);
  justify-content: center;
  align-items: center;
  padding: 20px;
  z-index: 10;
}
.modal.show { display: flex; }
.modal-box {
  width: 100%;
  max-width: 390px;
  background: white;
  padding: 30px 25px;
  border-radius: 16px;
  text-align: center;
  box-shadow: 0 12px 40px rgba(0,0,0,.2);
}
.modal-box h2 { margin-top: 0; }
.password {
  width: 100%;
  padding: 15px;
  margin: 15px 0 10px;
  border: 1px solid #cbd5e1;
  border-radius: 9px;
  font-size: 20px;
  text-align: center;
  letter-spacing: 4px;
}
.actions { display: flex; gap: 10px; margin-top: 12px; }
.actions button {
  flex: 1;
  padding: 13px;
  border: 0;
  border-radius: 8px;
  font-size: 15px;
  cursor: pointer;
}
.confirm { background: #2475d0; color: white; }
.cancel { background: #e9eef5; color: #334155; }
.message {
  min-height: 22px;
  margin-top: 12px;
  font-size: 14px;
  color: #dc2626;
}
.confirm:disabled { opacity: .6; cursor: wait; }
</style>
</head>
<body>

<header>CNCMEDITECH</header>

<main>
  <div class="logo">🖥️</div>
  <h1>Server Access</h1>
  <p class="subtitle">
    CNCMEDITECH 원격 서버 접속 프로그램
  </p>

  <section class="panel">
    <h2>Windows 접속 프로그램</h2>
    <p>TrueNAS 원격 접속 및 공유 폴더 이용</p>

    <button class="download" id="downloadBtn">
      프로그램 다운로드
    </button>

    <div class="note">
      프로그램 설치 및 이용 방법은 접속 프로그램에 포함됩니다.
    </div>
  </section>

  <footer>
    JWYoon. All rights reserved.<br>
    Copyright : JW<br>
    E-mail : <a href="mailto:jwhappy1@naver.com">jwhappy1@naver.com</a>
  </footer>
</main>

<div class="modal" id="passwordModal">
  <div class="modal-box">
    <h2>다운로드 인증</h2>
    <p>회사에서 안내받은 비밀번호를 입력하세요.</p>

    <form id="downloadForm">
      <input
        class="password"
        id="password"
        type="password"
        inputmode="numeric"
        pattern="[0-9]{10}"
        maxlength="10"
        minlength="10"
        placeholder="특/영/숫 조합 10자리"
        autocomplete="off"
        required
      >

      <div class="actions">
        <button type="button" class="cancel" id="cancelBtn">
          취소
        </button>
        <button type="submit" class="confirm" id="confirmBtn">
          확인
        </button>
      </div>
    </form>

    <div class="message" id="message"></div>
  </div>
</div>

<script>
// 실제 TrueNAS 다운로드 API 주소로 교체해야 합니다.
const DOWNLOAD_API =
  "https://YOUR-CLOUDFLARE-TUNNEL.trycloudflare.com/api/download";

const modal = document.getElementById("passwordModal");
const passwordInput = document.getElementById("password");
const message = document.getElementById("message");
const confirmBtn = document.getElementById("confirmBtn");

document.getElementById("downloadBtn").addEventListener("click", () => {
  modal.classList.add("show");
  passwordInput.value = "";
  message.textContent = "";
  setTimeout(() => passwordInput.focus(), 100);
});

document.getElementById("cancelBtn").addEventListener("click", () => {
  modal.classList.remove("show");
});

modal.addEventListener("click", (event) => {
  if (event.target === modal) {
    modal.classList.remove("show");
  }
});

passwordInput.addEventListener("input", () => {
  passwordInput.value = passwordInput.value.replace(/\D/g, "").slice(0, 10);
  message.textContent = "";
});

document.getElementById("downloadForm").addEventListener("submit", async (event) => {
  event.preventDefault();

  const password = passwordInput.value;

  if (!/^\d{10}$/.test(password)) {
    message.textContent = "숫자 10자리를 입력하세요.";
    return;
  }

  confirmBtn.disabled = true;
  confirmBtn.textContent = "인증 중...";
  message.textContent = "";

  try {
    const response = await fetch(DOWNLOAD_API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password })
    });

    if (!response.ok) {
      if (response.status === 401 || response.status === 403) {
        throw new Error("비밀번호가 올바르지 않습니다.");
      }
      if (response.status === 429) {
        throw new Error("인증 시도가 많습니다. 잠시 후 다시 시도하세요.");
      }
      throw new Error("다운로드 서버 오류가 발생했습니다.");
    }

    const blob = await response.blob();

    if (!blob.size) {
      throw new Error("다운로드 파일이 비어 있습니다.");
    }

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "CNCMEDITECH.exe";
    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 60000);
    modal.classList.remove("show");

  } catch (error) {
    message.textContent =
      error.message === "Failed to fetch"
        ? "인증 서버에 연결할 수 없습니다."
        : error.message;
  } finally {
    confirmBtn.disabled = false;
    confirmBtn.textContent = "확인";
  }
});
</script>

</body>
</html>
